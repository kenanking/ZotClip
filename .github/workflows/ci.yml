name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: build-result
          path: .scaffold/build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zotero: ["8.0.4", "9.0.6", "10.0.1"]
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - run: npm run test:unit
      - run: node scripts/test-zotero.mjs ${{ matrix.zotero }}
      - name: Install X11 clipboard test dependencies
        if: matrix.zotero == '10.0.1'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb xauth
      - name: Check delayed X11 clipboard ownership
        if: matrix.zotero == '10.0.1'
        run: node --import tsx scripts/test-clipboard-x11.ts 2>&1 | tee .scaffold/validation/clipboard-x11.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zotero-${{ matrix.zotero }}-logs
          path: |
            .scaffold/validation/*.log
          if-no-files-found: ignore
