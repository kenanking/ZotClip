<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  <html:link
    rel="stylesheet"
    href="chrome://__addonRef__/content/preferences.css"
  />
</linkset>
<groupbox
  class="zotclip-pref-group"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <label class="zotclip-pref-section"
    ><html:h3 data-l10n-id="pref-section-copy"></html:h3
  ></label>

  <hbox class="zotclip-pref-row" align="center">
    <html:label
      class="zotclip-pref-field-label"
      for="zotero-prefpane-__addonRef__-multi-attachment-mode"
      data-l10n-id="pref-multi-attachment-mode"
    ></html:label>
    <menulist
      id="zotero-prefpane-__addonRef__-multi-attachment-mode"
      class="zotclip-pref-menulist"
      preference="multiAttachmentMode"
    >
      <menupopup>
        <menuitem value="all" data-l10n-id="pref-multi-attachment-mode-all" />
        <menuitem
          value="primary"
          data-l10n-id="pref-multi-attachment-mode-primary"
        />
      </menupopup>
    </menulist>
  </hbox>

  <separator class="thin" />

  <vbox class="zotclip-pref-section" data-zotclip-types-panel="true">
    <label><html:h3 data-l10n-id="pref-section-types"></html:h3></label>

    <html:label
      class="zotclip-pref-field-label"
      data-l10n-id="pref-type-presets"
    ></html:label>

    <html:div class="zotclip-pref-type-grid">
      <html:label class="zotclip-pref-type-option">
        <html:input type="checkbox" data-zotclip-attachment-type="pdf" />
        <html:span data-l10n-id="pref-type-pdf"></html:span>
      </html:label>
      <html:label class="zotclip-pref-type-option">
        <html:input type="checkbox" data-zotclip-attachment-type="epub" />
        <html:span data-l10n-id="pref-type-epub"></html:span>
      </html:label>
      <html:label class="zotclip-pref-type-option">
        <html:input type="checkbox" data-zotclip-attachment-type="mobi" />
        <html:span data-l10n-id="pref-type-mobi"></html:span>
      </html:label>
      <html:label class="zotclip-pref-type-option">
        <html:input type="checkbox" data-zotclip-attachment-type="txt" />
        <html:span data-l10n-id="pref-type-txt"></html:span>
      </html:label>
    </html:div>

    <vbox class="zotclip-pref-field">
      <html:div
        class="zotclip-pref-inline-field"
        data-zotclip-inline-field="custom-types"
      >
        <html:label
          class="zotclip-pref-field-label"
          for="zotero-prefpane-__addonRef__-custom-attachment-types"
          data-l10n-id="pref-custom-types"
        ></html:label>
        <html:input
          id="zotero-prefpane-__addonRef__-custom-attachment-types"
          class="zotclip-pref-textinput"
          type="text"
          data-zotclip-custom-types="true"
        />
      </html:div>
      <description class="zotclip-pref-help">
        <html:span data-l10n-id="pref-custom-types-help"></html:span>
      </description>
      <description
        class="zotclip-pref-validation"
        data-zotclip-type-validation="true"
        hidden="hidden"
      >
        <html:span data-l10n-id="pref-type-validation"></html:span>
      </description>
    </vbox>
  </vbox>

  <separator class="thin" />

  <label class="zotclip-pref-section"
    ><html:h3 data-l10n-id="pref-section-interface"></html:h3
  ></label>

  <vbox class="zotclip-pref-field">
    <html:div class="zotclip-pref-toggle-row">
      <html:label class="zotclip-pref-type-option">
        <html:input type="checkbox" data-zotclip-context-menu-entry="true" />
        <html:span data-l10n-id="pref-show-context-menu"></html:span>
      </html:label>
      <html:label class="zotclip-pref-type-option">
        <html:input type="checkbox" data-zotclip-main-toolbar-button="true" />
        <html:span data-l10n-id="pref-main-toolbar-button"></html:span>
      </html:label>
      <html:label class="zotclip-pref-type-option">
        <html:input type="checkbox" data-zotclip-reader-toolbar-button="true" />
        <html:span data-l10n-id="pref-reader-toolbar-button"></html:span>
      </html:label>
    </html:div>
    <description class="zotclip-pref-help">
      <html:span data-l10n-id="pref-interface-help"></html:span>
    </description>
  </vbox>

  <separator class="thin" />

  <label class="zotclip-pref-section"
    ><html:h3 data-l10n-id="pref-section-shortcuts"></html:h3
  ></label>

  <description class="zotclip-pref-help">
    <html:span data-l10n-id="pref-shortcut-scope-note"></html:span>
  </description>

  <vbox class="zotclip-pref-field">
    <html:div
      class="zotclip-pref-inline-field"
      data-zotclip-inline-field="library-shortcut"
    >
      <html:label
        class="zotclip-pref-field-label"
        for="zotero-prefpane-__addonRef__-library-shortcut"
        data-l10n-id="pref-library-shortcut"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-library-shortcut"
        class="zotclip-pref-textinput"
        type="text"
        data-zotclip-library-shortcut="true"
      />
    </html:div>
  </vbox>

  <vbox class="zotclip-pref-field">
    <html:div
      class="zotclip-pref-inline-field"
      data-zotclip-inline-field="reader-shortcut"
    >
      <html:label
        class="zotclip-pref-field-label"
        for="zotero-prefpane-__addonRef__-reader-shortcut"
        data-l10n-id="pref-reader-shortcut"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-reader-shortcut"
        class="zotclip-pref-textinput"
        type="text"
        data-zotclip-reader-shortcut="true"
      />
    </html:div>
    <description
      class="zotclip-pref-validation"
      data-zotclip-shortcut-validation="true"
      hidden="hidden"
    >
      <html:span data-l10n-id="pref-shortcut-validation"></html:span>
    </description>
    <description
      class="zotclip-pref-validation"
      data-zotclip-shortcut-conflict="true"
      hidden="hidden"
    >
      <html:span data-l10n-id="pref-shortcut-conflict"></html:span>
    </description>
  </vbox>

  <description class="zotclip-pref-help">
    <html:span data-l10n-id="pref-compatibility-note"></html:span>
  </description>

  <separator class="thin" />

  <label class="zotclip-pref-section"
    ><html:h3 data-l10n-id="pref-section-compatibility"></html:h3
  ></label>

  <vbox class="zotclip-pref-field">
    <html:label
      class="zotclip-pref-field-label"
      data-l10n-id="pref-diagnostics"
    ></html:label>
    <description class="zotclip-pref-help">
      <html:div
        class="zotclip-pref-diagnostics"
        data-zotclip-diagnostics-list="true"
      ></html:div>
    </description>
  </vbox>

  <separator class="thin" />

  <html:div style="height: 28px"></html:div>

  <label class="zotclip-pref-section-heading"
    ><html:h3 data-l10n-id="pref-section-auto-tag"></html:h3
  ></label>

  <hbox class="zotclip-pref-row" align="center">
    <html:label class="zotclip-pref-type-option">
      <html:input type="checkbox" data-zotclip-auto-tag-enabled="true" />
      <html:span data-l10n-id="pref-auto-tag-enabled"></html:span>
    </html:label>
  </hbox>

  <hbox class="zotclip-pref-row" align="center">
    <html:label class="zotclip-pref-type-option">
      <html:input type="checkbox" data-zotclip-strip-connector-tags="true" />
      <html:span data-l10n-id="pref-strip-connector-tags"></html:span>
    </html:label>
  </hbox>

  <hbox class="zotclip-pref-row" align="center">
    <html:label class="zotclip-pref-type-option">
      <html:input type="checkbox" data-zotclip-auto-tag-on-add="true" />
      <html:span data-l10n-id="pref-auto-tag-on-add"></html:span>
    </html:label>
  </hbox>

  <hbox class="zotclip-pref-row" align="center">
    <html:label
      class="zotclip-pref-field-label zotclip-pref-inline-label"
      data-l10n-id="pref-ai-provider"
    ></html:label>
    <menulist class="zotclip-pref-menulist" data-zotclip-ai-provider="true">
      <menupopup>
        <menuitem value="deepseek" label="DeepSeek" />
        <menuitem value="openrouter" label="OpenRouter" />
        <menuitem value="ollama" label="Ollama" />
        <menuitem value="lmstudio" label="LM Studio" />
        <menuitem value="custom" label="Custom" />
      </menupopup>
    </menulist>
    <html:label
      class="zotclip-pref-field-label zotclip-pref-inline-label zotclip-pref-model-label"
      data-l10n-id="pref-auto-tag-model"
    ></html:label>
    <menulist class="zotclip-pref-menulist" data-zotclip-ai-model-menu="true">
      <menupopup></menupopup>
    </menulist>
    <html:input
      class="zotclip-pref-textinput"
      type="text"
      data-zotclip-ai-model-text="true"
      hidden="hidden"
      style="display: none"
    />
  </hbox>

  <hbox class="zotclip-pref-row" align="center">
    <html:label
      class="zotclip-pref-field-label zotclip-pref-inline-label"
      for="zotclip-api-key"
      data-l10n-id="pref-auto-tag-key"
    ></html:label>
    <html:input
      class="zotclip-pref-textinput"
      type="password"
      id="zotclip-api-key"
      aria-describedby="zotclip-key-status"
      data-zotclip-auto-tag-key="true"
      autocomplete="off"
    />
    <html:button data-zotclip-key-save="true" data-l10n-id="pref-key-save" />
    <html:button
      data-zotclip-key-delete="true"
      data-l10n-id="pref-key-delete"
    />
  </hbox>
  <html:div
    hidden="hidden"
    id="zotclip-key-status"
    class="zotclip-pref-help"
    role="status"
    data-zotclip-key-status="true"
  />

  <hbox class="zotclip-pref-row zotclip-pref-endpoint-row" align="center">
    <html:label
      class="zotclip-pref-field-label zotclip-pref-inline-label"
      data-l10n-id="pref-auto-tag-endpoint"
    ></html:label>
    <html:input
      class="zotclip-pref-textinput zotclip-pref-endpoint-input"
      type="text"
      data-zotclip-auto-tag-endpoint="true"
    />
    <html:button
      data-l10n-id="pref-ai-test-connection"
      data-zotclip-ai-test-connection="true"
    />
  </hbox>

  <description class="zotclip-pref-help">
    <html:span data-l10n-id="pref-api-key-storage-note"></html:span>
  </description>

  <vbox class="zotclip-pref-field">
    <hbox class="zotclip-pref-prompt-header">
      <html:label
        class="zotclip-pref-field-label"
        data-l10n-id="pref-ai-prompt"
      ></html:label>
      <html:button
        data-l10n-id="pref-ai-prompt-reset"
        data-zotclip-ai-prompt-reset="true"
      />
    </hbox>
    <html:textarea
      class="zotclip-pref-textinput zotclip-pref-prompt-area"
      rows="8"
      data-zotclip-ai-prompt="true"
    ></html:textarea>
    <description class="zotclip-pref-help">
      <html:span data-l10n-id="pref-ai-prompt-help"></html:span>
    </description>
  </vbox>
  <separator class="thin" />

  <vbox id="zotclip-migration" class="zotclip-pref-section">
    <label class="zotclip-pref-section-heading">
      <html:h3 data-l10n-id="pref-section-migration"></html:h3>
    </label>
    <description class="zotclip-pref-help" data-l10n-id="pref-migration-help" />

    <vbox class="zotclip-pref-field">
      <html:div
        id="zotclip-migration-contents"
        class="zotclip-pref-field-label"
        data-text="migration-contents"
      ></html:div>
      <html:div
        id="zotclip-migration-categories"
        class="zotclip-pref-toggle-row"
        role="group"
        aria-labelledby="zotclip-migration-contents"
      ></html:div>
      <description class="zotclip-pref-help"
        ><html:span data-text="migration-scope"></html:span
      ></description>
    </vbox>

    <html:div class="zotclip-pref-field">
      <html:label class="zotclip-pref-type-option">
        <html:input
          id="zotclip-migration-encrypt"
          type="checkbox"
          aria-controls="zotclip-migration-password-fields"
        />
        <html:span data-text="migration-encrypt-option"></html:span>
      </html:label>
      <html:div
        id="zotclip-migration-plaintext-note"
        class="zotclip-pref-help"
        data-text="migration-plaintext-note"
      ></html:div>
    </html:div>
    <html:div id="zotclip-migration-password-fields" hidden="hidden">
      <vbox class="zotclip-pref-field">
        <html:div class="zotclip-pref-inline-field">
          <html:label
            class="zotclip-pref-field-label"
            for="zotclip-migration-password"
            data-text="migration-password"
          ></html:label>
          <html:input
            id="zotclip-migration-password"
            class="zotclip-pref-textinput"
            type="password"
            autocomplete="off"
            aria-describedby="zotclip-migration-password-help"
          />
        </html:div>
      </vbox>
      <vbox class="zotclip-pref-field">
        <html:div class="zotclip-pref-inline-field">
          <html:label
            class="zotclip-pref-field-label"
            for="zotclip-migration-confirm-password"
            data-text="migration-confirm-password"
          ></html:label>
          <html:input
            id="zotclip-migration-confirm-password"
            class="zotclip-pref-textinput"
            type="password"
            autocomplete="off"
          />
        </html:div>
        <description
          id="zotclip-migration-password-help"
          class="zotclip-pref-help"
          ><html:span data-text="migration-password-help"></html:span
        ></description>
      </vbox>
    </html:div>

    <html:div class="zotclip-pref-inline-field zotclip-pref-field">
      <html:button
        id="zotclip-migration-export"
        type="button"
        data-text="migration-export"
      ></html:button>
      <html:button
        id="zotclip-migration-import"
        type="button"
        data-text="migration-import"
      ></html:button>
      <html:button
        id="zotclip-migration-cancel"
        type="button"
        hidden="hidden"
        data-text="migration-cancel"
      ></html:button>
    </html:div>
    <html:div
      id="zotclip-migration-unlock"
      class="zotclip-pref-field"
      hidden="hidden"
    >
      <html:div
        id="zotclip-migration-import-file"
        class="zotclip-pref-help"
      ></html:div>
      <html:div class="zotclip-pref-inline-field zotclip-pref-field">
        <html:label
          for="zotclip-migration-import-password"
          class="zotclip-pref-field-label"
          data-text="migration-import-password"
        ></html:label>
        <html:input
          id="zotclip-migration-import-password"
          class="zotclip-pref-textinput"
          type="password"
          autocomplete="off"
        />
      </html:div>
      <html:div class="zotclip-pref-inline-field zotclip-pref-field">
        <html:button
          id="zotclip-migration-unlock-preview"
          type="button"
          data-text="migration-unlock-preview"
        ></html:button>
        <html:button
          id="zotclip-migration-unlock-cancel"
          type="button"
          data-text="migration-cancel"
        ></html:button>
      </html:div>
    </html:div>
    <html:progress
      id="zotclip-migration-progress"
      hidden="hidden"
    ></html:progress>
    <html:div
      id="zotclip-migration-status"
      class="zotclip-pref-help"
      role="status"
      aria-live="polite"
    ></html:div>

    <html:section
      id="zotclip-migration-preview"
      hidden="hidden"
      aria-labelledby="zotclip-migration-preview-title"
    >
      <html:h3
        id="zotclip-migration-preview-title"
        data-text="migration-preview"
      ></html:h3>
      <html:div
        id="zotclip-migration-source"
        class="zotclip-pref-help"
      ></html:div>
      <html:p
        class="zotclip-pref-help"
        data-text="migration-preview-help"
      ></html:p>
      <html:div class="zotclip-pref-inline-field zotclip-pref-field">
        <html:label
          for="zotclip-migration-filter"
          class="zotclip-pref-field-label"
          data-text="migration-filter"
        ></html:label>
        <html:input
          id="zotclip-migration-filter"
          class="zotclip-pref-textinput"
          type="search"
        />
      </html:div>
      <html:div class="zotclip-pref-inline-field zotclip-pref-field">
        <html:button
          id="zotclip-migration-select-visible"
          type="button"
          data-text="migration-select-visible"
        ></html:button>
        <html:button
          id="zotclip-migration-clear-visible"
          type="button"
          data-text="migration-clear-visible"
        ></html:button>
      </html:div>
      <html:div id="zotclip-migration-rows"></html:div>
      <html:button
        id="zotclip-migration-more"
        type="button"
        hidden="hidden"
        data-text="migration-more"
      ></html:button>
      <html:p
        id="zotclip-migration-recovery-mode"
        class="zotclip-pref-help"
      ></html:p>
      <html:p id="zotclip-migration-selection" role="status"></html:p>
      <html:label class="zotclip-pref-type-option">
        <html:input id="zotclip-migration-consent" type="checkbox" />
        <html:span data-text="migration-consent"></html:span>
      </html:label>
      <html:div class="zotclip-pref-field">
        <html:button
          id="zotclip-migration-apply"
          type="button"
          disabled="disabled"
          data-text="migration-apply"
        ></html:button>
      </html:div>
    </html:section>
    <html:div id="zotclip-migration-result" role="status"></html:div>
  </vbox>
</groupbox>
<vbox class="zotclip-pref-build">
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
